tools:
  - name: clarify
    description: "Ask the user for missing information. For any send/post/publish request, use response_type=yes_no before calling send."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Use yes_no for send/post/publish confirmation; use text for missing URL, account, handle, or content."}
        options: {type: array, default: [], items: {type: string}, description: "Choices when response_type is choice"}
      required: [question]

  - name: timeline
    description: "Get recent posts/tweets from a specific account handle. Use for requests about one person's posts."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @, for example sama, elonmusk, karpathy"}
        limit: {type: integer, default: 5, description: "Number of posts to fetch"}
      required: [screenname]

  - name: social_search
    description: "Search social posts/tweets by topic. Do not use if the latest turn says to drop Twitter/social search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search topic"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Use Top only when the user asks for top/popular posts"}
        limit: {type: integer, default: 5, description: "Number of posts"}
      required: [query]

  - name: lookup
    description: "Search the web. Use topic=news for news/current-events requests and map today/week/month/year to timeframe."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        topic: {type: string, enum: [general, news], default: "general", description: "Use news for news/current events"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Search time range"}
        max_results: {type: integer, default: 5, description: "Maximum results"}
      required: [query]

  - name: fetch
    description: "Fetch/read a specific URL supplied by the user."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL to read"}
      required: [url]

  - name: format
    description: "Format existing items into a digest, sections, bullets, thread, or daily AI Vietnamese digest."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template"}
        headline: {type: string, default: "", description: "Headline"}
      required: [items, template]

  - name: send
    description: "Send/post text only after explicit user confirmation. If not confirmed, call clarify with response_type=yes_no first."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to send"}
        confirmed: {type: boolean, default: false, description: "True only after explicit user confirmation"}
      required: [text]

  - name: policy
    description: "Search local internal company policy documents."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area"}
        top_k: {type: integer, default: 3, description: "Number of results"}
      required: [query]

  - name: papers
    description: "Search scientific papers on arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query"}
        max_results: {type: integer, default: 5, description: "Maximum results"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order"}
      required: [query]

  - name: paper_text
    description: "Fetch text from a specific arXiv paper by URL or ID."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv URL or ID"}
        max_pages: {type: integer, default: 5, description: "Maximum pages"}
        max_chars: {type: integer, default: 8000, description: "Maximum characters"}
      required: [arxiv_url]

  - name: new_tool
    description: "Analyze notes/text locally to produce summary, action items, keywords, markdown, and stats."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text or notes to analyze"}
        focus: {type: string, default: "", description: "Topic to prioritize while selecting summary sentences"}
        max_items: {type: integer, default: 5, description: "Maximum items to return per list"}
      required: [text]
